<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EcoTour</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page signup-page">
    <nav class="navbar glass-nav">
        <a href="index.html" class="nav-brand">EcoTour</a>
    </nav>

    <div class="auth-wrapper">
        <div class="glass-card text-center">
            <h2 class="mb-2">Create Account</h2>
            <form id="signupForm">
                <div class="form-group text-left">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="signupName" class="form-control" required>
                </div>
                <div class="form-group text-left">
                    <label class="form-label">Email</label>
                    <input type="email" id="signupEmail" class="form-control" required>
                </div>
                <div class="form-group text-left">
                    <label class="form-label">Password</label>
                    <input type="password" id="signupPassword" class="form-control" required>
                </div>
                <div class="form-group text-left">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-control">
                        <option value="user">Tourist</option>
                        <option value="guide">Guide</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-glass" style="width: 100%;">Sign Up</button>
            </form>
            <p class="mt-1" id="signupError" style="color: red;"></p>
            <p class="mt-2 text-secondary">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <!-- Chatbot Widget -->
    <div id="chatbot-container"></div>
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
