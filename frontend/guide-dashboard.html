<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Dashboard - EcoTour</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">EcoTour</div>
            <nav class="sidebar-nav">
                <a href="#" class="active" data-target="section-profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    My Profile
                </a>
                <a href="#" data-target="section-requests">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    Booking Requests
                </a>
                <a href="#" data-target="section-settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="top-header">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <div class="header-right">
                    <span id="userNameDisplay" class="badge badge-accepted"></span>
                    <button onclick="logout()" class="btn btn-outline">Logout</button>
                </div>
            </header>
            
            <main class="content-area">
                <div class="container" style="padding-top: 0;">
                    
                    <div id="section-profile" class="dashboard-section active">
                        <div class="card" style="max-width: 600px; margin: 0 auto;">
                            <h3 class="mb-1">My Profile</h3>
                            <form id="profileForm">
                                <div class="form-group">
                                    <label class="form-label">Bio</label>
                                    <textarea id="guideBio" class="form-control" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Location</label>
                                    <input type="text" id="guideLocation" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Languages</label>
                                    <input type="text" id="guideLanguages" class="form-control" placeholder="English, Spanish...">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Experience</label>
                                    <input type="text" id="guideExperience" class="form-control" placeholder="e.g. 5 years">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Price per Day ($)</label>
                                    <input type="number" id="guidePrice" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Phone Number</label>
                                    <input type="text" id="guidePhone" class="form-control" placeholder="10-digit number" required>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Profile</button>
                            </form>
                            <p id="profileMessage" class="mt-1 text-center" style="color: var(--primary-color); font-weight: bold;"></p>
                        </div>
                    </div>

                    <div id="section-requests" class="dashboard-section">
                        <h3 class="mb-1">Booking Requests</h3>
                        <div id="bookingRequests" class="grid">
                            <!-- Bookings loaded here -->
                        </div>
                    </div>

                    <div id="section-settings" class="dashboard-section">
                        <div class="card" style="max-width: 600px; margin: 0 auto;">
                            <h3 class="mb-1">Account Settings</h3>
                            <form id="settingsForm">
                                <div class="form-group">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" id="settingsName" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" id="settingsEmail" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
                            </form>
                            <p id="settingsMessage" class="mt-1 text-center" style="font-weight: bold;"></p>
                            
                            <hr style="margin: 2rem 0; border: none; border-top: 1px solid rgba(0,0,0,0.1);">
                            
                            <div class="danger-zone" style="background: rgba(254, 226, 226, 0.5); padding: 1.5rem; border-radius: 8px; border: 1px solid #fca5a5;">
                                <h4 style="color: #b91c1c; margin-bottom: 0.5rem;">Danger Zone</h4>
                                <p style="font-size: 0.9rem; color: #7f1d1d; margin-bottom: 1rem;">Once you delete your account, there is no going back. Please be certain.</p>
                                <button id="deleteAccountBtn" class="btn" style="background: #ef4444; color: white; width: 100%;">Delete Account</button>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <!-- Chatbot Widget is dynamically injected by chatbot.js -->

    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/guide.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
