<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - EcoTour</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page login-page">
    <nav class="navbar glass-nav">
        <a href="index.html" class="nav-brand">EcoTour</a>
    </nav>

    <div class="auth-wrapper">
        <div class="glass-card text-center">
            <h2 class="mb-2">Create New Password</h2>
            
            <form id="resetPasswordForm">
                <div class="form-group text-left">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group text-left">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-glass" style="width: 100%;">Reset Password</button>
            </form>
            
            <div id="resetMessage" class="mt-1" style="font-weight: 500; font-size: 0.9rem;"></div>
            
            <p class="mt-2 text-secondary">
                <a href="login.html">Back to Login</a>
            </p>
        </div>
    </div>

    <!-- Chatbot Widget is dynamically injected by chatbot.js -->
    <script src="js/reset.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
