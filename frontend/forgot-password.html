<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EcoTour</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page login-page">
    <nav class="navbar glass-nav">
        <a href="index.html" class="nav-brand">EcoTour</a>
    </nav>

    <div class="auth-wrapper">
        <div class="glass-card text-center">
            <h2 class="mb-2">Reset Password</h2>
            <p class="text-secondary mb-2" style="font-size: 0.9rem;">Enter your email address and we'll send you a link to reset your password.</p>
            
            <form id="forgotPasswordForm">
                <div class="form-group text-left">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="forgotEmail" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-glass" style="width: 100%;">Send Reset Link</button>
            </form>
            
            <div id="forgotMessage" class="mt-1" style="font-weight: 500; font-size: 0.9rem; word-break: break-all;"></div>
            
            <p class="mt-2 text-secondary">
                Remember your password? <a href="login.html">Log In</a>
            </p>
        </div>
    </div>

    <!-- Chatbot Widget is dynamically injected by chatbot.js -->
    <script src="js/reset.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
