<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoTour</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page login-page">
    <nav class="navbar glass-nav">
        <a href="index.html" class="nav-brand">EcoTour</a>
    </nav>

    <div class="auth-wrapper">
        <div class="glass-card text-center">
            <h2 class="mb-2">Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group text-left">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" required>
                </div>
                <div class="form-group text-left">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                    <div style="text-align: right; margin-top: 5px;">
                        <a href="forgot-password.html" style="font-size: 0.85rem; font-weight: normal;">Forgot Password?</a>
                    </div>
                </div>
                <div class="form-group text-left">
                    <label class="form-label">Role</label>
                    <select id="loginRole" class="form-control">
                        <option value="user">Tourist</option>
                        <option value="guide">Guide</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-glass" style="width: 100%;">Login</button>
            </form>
            <p class="mt-1" id="loginError" style="color: red;"></p>
            <p class="mt-2 text-secondary">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Chatbot Widget is dynamically injected by chatbot.js -->
    <script src="js/auth.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
